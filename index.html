<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="yh数码官网，HiteBook笔记本、Your手机系列、Horizon产品">
    <meta name="keywords" content="yh,HiteBook,Your手机,Horizon,yh官网">
    <title>yh官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 全局苹果系统字体 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            overflow-x: hidden;
        }
        /* 全局平滑滚动 */
        html {
            scroll-behavior: smooth;
        }
        /* 苹果官网固定导航栏 */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 32px;
            padding: 12px 48px;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 999;
        }
        .nav img {
            height: 20px;
        }
        /* 汉堡按钮 移动端默认隐藏 */
        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size:24px;
            cursor:pointer;
            color:#1d1d1f;
        }
        .nav-menu {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            gap: 44px;
        }
        /* 橄榄胶囊滑块 */
        .pill-slider {
            position: absolute;
            bottom: -6px;
            height: 4px;
            background-color: #0071e3;
            border-radius: 999px;
            transition: left 0.35s cubic-bezier(0.4,0,0.2,1), width 0.35s cubic-bezier(0.4,0,0.2,1);
            z-index: 0;
        }
        .nav-menu a {
            position: relative;
            z-index: 1;
            text-decoration: none;
            color: #1d1d1f;
            font-size: 14px;
            font-weight: 400;
            padding:4px 0;
        }
        .nav-menu a:hover {
            color: #0071e3;
        }
        .nav-menu a.active {
            color:#0071e3;
        }
        /* 锚点滚动偏移，避开导航栏 */
        section {
            scroll-margin-top: 64px;
            padding:0;
            margin:0;
        }

        /* ========== 滚动浮现基础效果 ========== */
        .reveal {
            opacity: 0;
            transform: translateY(34px);
            transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-text {
            transition-delay: 0.08s;
        }
        .reveal-image {
            transition-delay: 0.18s;
        }
        .reveal-button {
            transition-delay: 0.28s;
        }

        /* banner 图片区 */
        .banner {
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f7;
            overflow: hidden;
        }
        /* 首页主 banner 稍高 */
        #top .banner {
            min-height: 78vh;
        }
        /* 产品系列 banner */
        section .banner {
            min-height: 62vh;
        }

        /* 首页顶部，修复被导航遮挡 */
        #top {
            padding-top: 64px;
        }
        .top-title {
            text-align: center;
            padding: 72px 20px 24px;
        }
        .top-title strong {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -0.6px;
        }
        /* 产品板块：苹果风格标题 */
        section h2 {
            text-align: center;
            font-size: 48px;
            font-weight: 600;
            padding: 56px 20px 16px;
            letter-spacing: -0.5px;
        }

        /* ==========【美化后的进一步了解 方案A：箭头单独位移】========== */
        .more-link-wrap{
            text-align: center;
            margin:24px 0 48px;
        }
        .more-link{
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size:17px;
            color:#0071e3;
            text-decoration: none;
            display: inline-block;
        }
        .more-link span{
            display: inline-block;
            transition: transform 0.22s ease;
        }
        .more-link:hover{
            color:#0077ed;
        }
        .more-link:hover span{
            transform: translateX(4px);
        }

        /* ========== 移动端媒体查询 <768px ========== */
        @media (max-width:768px){
            .nav {
                padding:12px 20px;
                justify-content: space-between;
            }
            .hamburger{
                display:block;
            }
            .nav-menu{
                /* 手机菜单默认隐藏 */
                position: fixed;
                top:52px;
                left:0;
                width:100%;
                background:rgba(255,255,255,0.94);
                flex-direction:column;
                gap:24px;
                padding:24px;
                justify-content:flex-start;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            }
            .nav-menu.open{
                transform: translateX(0);
            }
            /* 手机端隐藏胶囊滑块，小屏幕不适合 */
            .pill-slider{
                display:none;
            }

            /* 手机端banner图片：改为靠上对齐，防止产品被裁没 */
            .banner{
                background-position: center top !important;
            }
            #top .banner {
                min-height: 60vh;
            }
            section .banner {
                min-height: 50vh;
            }

            /* 手机缩小标题字号 */
            .top-title strong{
                font-size:36px;
            }
            section h2{
                font-size:30px;
                padding:36px 12px 12px;
            }
            .top-title{
                padding:40px 12px 16px;
            }
        }
        /* ==========回到顶部按钮 苹果简约圆形========== */
#backToTop {
    position: fixed;
    z-index: 900;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: none;
    background-color: #0071e3;
    color: #fff;
    font-size:18px;
    cursor: pointer;

    /* 默认隐藏，使用opacity做过渡 */
    opacity:0;
    visibility:hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
}
#backToTop.show{
    opacity:1;
    visibility:visible;
}
#backToTop:hover{
    background-color:#0077ed;
}
#backToTop:active{
    transform: scale(0.96);
}

/* 移动端适配，适配ios底部安全区 */
@media(max-width:768px){
    #backToTop{
        bottom: calc(16px + env(safe-area-inset-bottom));
        right:16px;
        width:48px;
        height:48px;
    }
}

    </style>
</head>
<body>
    <!-- 固定导航 -->
    <div class="nav">
        <img src="images/logo.png" alt="logo">
        <button class="hamburger">☰</button>
        <div class="nav-menu">
            <div class="pill-slider"></div>
            <a href="#top">首页</a>
            <a href="#hite">Hite系列</a>
            <a href="#your">Your系列</a>
            <a href="#horizon">Horizon</a>
            <a href="#news">资讯</a>
        </div>
    </div>

    <!-- 顶部锚点 首页 -->
    <div id="top">
        <div class="top-title">
            <strong class="reveal reveal-text">yh官网</strong>
        </div>
        <div class="banner reveal reveal-image" style="background-image: url('images/pages.png');"></div>
    </div>

    <!-- Hite系列板块 -->
    <section id="hite">
        <h2 class="reveal reveal-text">HiteBook系列</h2>
        <div class="banner reveal reveal-image" style="background-image: url('images/hitebook3.png');"></div>
        <div class="more-link-wrap">
            <a class="more-link reveal reveal-button" href="hite.html">进一步了解 <span>›</span></a>
        </div>
    </section>

    <!-- Your系列板块 -->
    <section id="your">
        <h2 class="reveal reveal-text">Your系列</h2>
        <div class="banner reveal reveal-image" style="background-image: url('images/your.png');"></div>
    </section>

    <!-- Horizon板块 -->
    <section id="horizon">
        <h2 class="reveal reveal-text">Horizon</h2>
        <div class="banner reveal reveal-image"></div>
    </section>

    <!-- 资讯板块 -->
    <section id="news">
        <h2 class="reveal reveal-text">资讯</h2>
        <div class="banner reveal reveal-image"></div>
    </section>
<footer style="background:#f5f5f7; padding:40px 20px 24px; margin-top:60px; font-size:12px; color:#6e6e73; line-height:1.6;">
  <div style="max-width:980px; margin:0 auto;">
    <div style="border-bottom:1px solid #d2d2d7; padding-bottom:16px; margin-bottom:16px;">
      <p>© 2026 yh 版权所有</p>
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:20px;">
      <a href="terms.html" style="color:#424245; text-decoration:none;">使用条款</a>
      <a href="privacy.html" style="color:#424245; text-decoration:none;">隐私政策</a>
      <a href="support.html" style="color:#424245; text-decoration:none;">技术支持</a>
      <a href="contact.html" style="color:#424245; text-decoration:none;">联系我们</a>
    </div>
  </div>
</footer>
<button id="backToTop" aria-label="回到顶部">↑</button>
<script>
const navMenu = document.querySelector('.nav-menu');
const pillSlider = document.querySelector('.pill-slider');
const navLinks = document.querySelectorAll('.nav-menu a');
const hamburger = document.querySelector('.hamburger');
const sections = [];

navLinks.forEach(link=>{
    const id = link.getAttribute('href').replace('#','');
    const el = document.getElementById(id);
    if(el) sections.push({link, el});
})

// 汉堡菜单切换
hamburger.addEventListener('click',()=>{
    navMenu.classList.toggle('open');
})
// 点击导航链接自动关闭移动端菜单
navLinks.forEach(link=>{
    link.addEventListener('click',()=>{
        if(window.innerWidth <=768){
            navMenu.classList.remove('open');
        }
        setTimeout(()=>updatePill(link),100);
    })
})

// 更新胶囊滑块位置&宽度核心函数
function updatePill(targetLink){
    // 手机直接不计算滑块
    if(window.innerWidth <=768) return;
    if(!targetLink) return;
    const menuRect = navMenu.getBoundingClientRect();
    const linkRect = targetLink.getBoundingClientRect();
    pillSlider.style.left = `${linkRect.left - menuRect.left}px`;
    pillSlider.style.width = `${linkRect.width}px`;
}

// 滚动时，设置激活项，并且移动橄榄滑块
function setActiveMenu(){
    let currentItem = null;
    sections.forEach(item=>{
        const rect = item.el.getBoundingClientRect();
        if(rect.top <= 120){
            currentItem = item;
        }
    })
    navLinks.forEach(link=>link.classList.remove('active'));
    if(currentItem){
        currentItem.link.classList.add('active');
        updatePill(currentItem.link);
    }
}

/* ========== 滚动浮现逻辑 ========== */
const revealElements = document.querySelectorAll('.reveal');
function checkReveal() {
    const windowHeight = window.innerHeight;
    const revealPoint = 120;
    revealElements.forEach(element => {
        const elementTop = element.getBoundingClientRect().top;
        if (elementTop < windowHeight - revealPoint) {
            element.classList.add('visible');
        }
    });
}
window.addEventListener('load', () => {
    setActiveMenu();
    checkReveal();
    checkBackToTop();
});
window.addEventListener('scroll', () => {
    setActiveMenu();
    checkReveal();
    checkBackToTop();
});
window.addEventListener('resize', () => {
    setActiveMenu();
    checkBackToTop();
});
// --------回到顶部逻辑--------
const backToTopBtn = document.getElementById('backToTop');

function checkBackToTop(){
    if(window.scrollY > 400){
        backToTopBtn.classList.add('show');
    }else{
        backToTopBtn.classList.remove('show');
    }
}

backToTopBtn.addEventListener('click',()=>{
    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
});
</script>
</body>
</html>
